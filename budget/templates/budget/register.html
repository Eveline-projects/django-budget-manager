{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'budget/style.css' %}">
</head>

<body class="bg-light">

<!-- 1. Pudełko na górze: header -->
<!-- HEADER -->
<header style="background-color: #0A84FF; height: 80px;" class="text-white shadow-sm d-flex align-items-center">
    <div class="container d-flex align-items-center justify-content-between">

        <!-- LOGO F4 + tekst -->
        <a href="/" class="d-flex align-items-center text-decoration-none">
            <div class="logo-box d-flex align-items-center justify-content-center me-3 transition-hover">
                <span class="logo-text">F4</span>
            </div>
          <span class="logo-label">F4 Wallets</span>

<style>
    .logo-label {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;           /* font-extrabold */
        letter-spacing: -0.025em;   /* tracking-tighter */
        font-size: 1.5rem;          /* odpowiada text-2xl w Tailwind */
        color: white;               /* text-white */
    }
</style>
        </a>

        <a href="/budget/login/" class="registration-btn">
    Login
</a>

<style>
.registration-btn {
    display: inline-block;
    padding: 0.5rem 1rem;          /* węższy przycisk */
    font-family: 'Manrope', sans-serif;
    font-size: 0.875rem;           /* text-sm */
    font-weight: 500;               /* medium, jak Login */
    letter-spacing: 0.05em;         /* tracking-wide */
    color: white;
    border: 1px solid rgba(255,255,255,0.3); /* border-white/30 */
    border-radius: 0.5rem;          /* rounded-lg */
    text-decoration: none;           /* usuwa podkreślenie */
    text-align: center;
    transition: all 0.3s ease;
}

.registration-btn:hover {
    background-color: rgba(255,255,255,0.1); /* hover efekt */
}
</style>

    </div>
</header>

<!-- STYLE DO LOGO -->
<style>
    .logo-box {
        width: 39.4px;
        height: 41.4px;
        background-color: white;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.3s ease;
    }

    .logo-box:hover {
        transform: rotate(12deg);
    }

    .logo-text {
        color: #0059B9;
        font-weight: 900;
        font-size: 1.875rem;
        line-height: 2.1rem;
    }
</style>

<!-- 3. Pudełko środkowe: formularz rejestracji -->
<!-- Google Font (dodaj do <head> w base.html) -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Formularz -->
<div class="container flex-grow-1 d-flex justify-content-center align-items-start"
     style="min-height: 100vh; padding-top: 100px; font-family: 'Manrope', sans-serif;">
    <div class="card shadow-lg border-0 p-4"
         style="max-width: 400px; width:100%; border-radius: 20px;">

        <h3 class="text-center mb-4 fw-bold" style="letter-spacing: 0.5px;">
            REGISTER
        </h3>

        <form method="POST">
            {% csrf_token %}

            {{ form|crispy }}

            <button type="submit"
                    class="btn w-100 mt-3"
                    style="background-color: #4f46e5; color: white; border-radius: 10px; font-weight: 500;">
                SIGN UP
            </button>
        </form>

    </div>
</div>


</body>
</html>
