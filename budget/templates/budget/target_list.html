<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Cele</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Your list of goals</h1>
        <a href="{% url 'budget:expense' %}" class="btn btn-outline-info me-2">Back </a>
        <a href="{% url 'budget:target' %}" class="btn btn-outline-secondary">Add a new goal</a>
    </div>

    {% if targets %}
        <div class="list-group">
            {% for target in targets %}
            <div class="list-group-item list-group-item-action mb-2">
                <h5>{{ target.target_type }}</h5>
                <p><strong>Amount:</strong> {{ target.target_balance }} PLN</p>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-center">You don't have any goals yet.</p>
    {% endif %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
