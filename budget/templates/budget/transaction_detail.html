<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>transaction details</title>
    <style>
        .btn {
            display: inline-block;
            padding: 8px 12px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #45a049;
        }
        .detail-box {
            border: 1px solid #ddd;
            padding: 20px;
            width: 400px;
            border-radius: 6px;
            background-color: #f9f9f9;
        }
        .detail-box h2 {
            margin-top: 0;
        }
        .detail-row {
            margin: 8px 0;
        }
        .detail-label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<a href="{% url 'budget:transaction' %}" class="btn">Back to list</a>

<div class="detail-box">
    <h2>transaction details</h2>

    <div class="detail-row">
        <span class="detail-label">Date:</span> {{ transaction.date|date:"Y-m-d H:i" }}
    </div>
    <div class="detail-row">
        <span class="detail-label">Amount:</span> {{ transaction.amount }} PLN
    </div>
    <div class="detail-row">
        <span class="detail-label">Category:</span> {{ transaction.get_category_display }}
    </div>
    <div class="detail-row">
        <span class="detail-label">Description:</span> {{ transaction.description|default:"Brak" }}
    </div>
</div>

</body>
</html>
