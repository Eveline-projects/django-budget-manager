{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add Transaction - F4 Wallets</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#067bf9",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: {"display": ["Manrope"]},
                },
            },
        }
    </script>
    <style>
        .ios-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
        html, body { height: 100%; overflow: hidden; margin: 0; }

        /* KLUCZOWA POPRAWKA: outline-offset -2px sprawia, że ramka wchodzi do środka i nie jest ucinana */
        input:focus, select:focus, textarea:focus {
            outline: 2px solid #067bf9 !important;
            outline-offset: -2px !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100">

<form method="POST" id="transaction-form" class="max-w-[430px] mx-auto h-full flex flex-col" onsubmit="syncDateTime()">
    {% csrf_token %}
    <input type="hidden" name="date" id="final_date">

    <header class="px-4 py-4 flex items-center justify-between flex-shrink-0">
        <a href="{% url 'budget:transaction' %}" class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
            <span class="material-symbols-outlined text-slate-600">close</span>
        </a>
        <h1 class="text-lg font-bold tracking-tight">Add Transaction</h1>
        <div class="size-10"></div>
    </header>

    <main class="flex-1 px-4 pb-4 flex flex-col min-h-0">

        <div class="flex p-1 bg-slate-200 dark:bg-slate-800 rounded-xl mb-4 flex-shrink-0">
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="OUT" class="sr-only peer" checked>
                <div class="py-2 text-sm font-semibold rounded-lg text-center text-slate-500 peer-checked:bg-white peer-checked:text-slate-900 transition-all shadow-sm">Outcome</div>
            </label>
            <label class="flex-1 cursor-pointer">
                <input type="radio" name="type" value="IN" class="sr-only peer">
                <div class="py-2 text-sm font-semibold rounded-lg text-center text-slate-500 peer-checked:bg-white peer-checked:text-slate-900 transition-all shadow-sm">Income</div>
            </label>
        </div>

        <div class="bg-white dark:bg-slate-900 rounded-2xl p-5 ios-shadow border border-slate-100 dark:border-slate-800 flex-1 flex flex-col justify-between min-h-0">

            <div class="space-y-4 overflow-y-auto px-1 custom-scrollbar flex-1 flex flex-col">
                <div class="space-y-2 flex-shrink-0">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Amount</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-2xl font-bold text-slate-400">PLN</span>
                        <input name="amount" type="number" step="0.01" class="w-full pl-16 pr-4 py-4 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-3xl font-bold focus:ring-0" placeholder="0.00" required/>
                    </div>
                </div>

                <div id="target-section" class="space-y-2 flex-shrink-0">
                    <label class="text-xs font-bold uppercase tracking-wider text-primary ml-1">Assign to Goal</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">emoji_events</span>
                        <select name="target" class="w-full pl-12 pr-10 py-3.5 bg-blue-50 dark:bg-slate-800 border-none rounded-xl text-base font-medium appearance-none focus:ring-0">
                            <option value="">No specific goal</option>
                            {% for target in targets %}
                            <option value="{{ target.id }}">{{ target.target_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="space-y-2 flex-shrink-0">
                    <label id="category-label" class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Category</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">category</span>
                        <select id="category_select" name="category" class="w-full pl-12 pr-10 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-base font-medium appearance-none focus:ring-0">
                            <option value="">Select Category</option>
                            {% for cat in form.fields.category.queryset %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 flex-shrink-0">
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Date</label>
                        <input id="input_date" type="date" value="{% now 'Y-m-d' %}" class="w-full px-3 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-0"/>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Time</label>
                        <input id="input_time" type="time" value="{% now 'H:i' %}" class="w-full px-3 py-3 bg-slate-50 dark:bg-slate-800 border-none rounded-xl text-sm font-medium focus:ring-0"/>
                    </div>
                </div>

                <div class="space-y-2 flex-shrink-0">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Account</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">account_balance_wallet</span>
                        <select name="account" class="w-full pl-12 pr-10 py-3.5 bg-slate-50 border-none rounded-xl text-base font-medium appearance-none focus:ring-0" required>
                            <option value="">Select Account</option>
                            {% for acc in form.fields.account.queryset %}
                            <option value="{{ acc.id }}">{{ acc.name_account }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="space-y-2 flex-1 flex flex-col">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 ml-1">Description</label>
                    <textarea name="description" class="w-full flex-1 p-4 bg-slate-50 border-none rounded-xl text-base font-medium resize-none focus:ring-0" placeholder="Optional notes..."></textarea>
                </div>
            </div>

            <div class="pt-4 flex-shrink-0 px-1">
                <button type="submit" class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/25 active:scale-[0.98] transition-transform">
                    Create Transaction
                </button>
            </div>
        </div>
    </main>
</form>

<script>
    function syncDateTime() {
        const date = document.getElementById('input_date').value;
        const time = document.getElementById('input_time').value;
        document.getElementById('final_date').value = date + 'T' + time;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const typeRadios = document.querySelectorAll('input[name="type"]');
        const targetSection = document.getElementById('target-section');

        function updateUI() {
            const selectedType = document.querySelector('input[name="type"]:checked').value;
            if (selectedType === 'OUT') {
                targetSection.style.display = 'none';
            } else {
                targetSection.style.display = 'block';
            }
        }
        typeRadios.forEach(r => r.addEventListener('change', updateUI));
        updateUI();
    });
</script>
</body>
</html>
