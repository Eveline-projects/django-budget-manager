{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Add Category - F4</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                  "primary": "#067bf9",
                  "surface": "#f5f7f8",
                  "on-surface": "#1e293b",
                  "on-surface-variant": "#64748b",
              },
              "borderRadius": {
                  "2xl": "1.5rem",
                  "3xl": "2.5rem",
              },
              "boxShadow": {
                "ios-shadow": "0 20px 50px rgba(0,0,0,0.06)"
              }
            },
          },
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #f5f7f8; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
    </style>
</head>
<body class="bg-[#f5f7f8] text-on-surface min-h-screen flex items-center justify-center py-12 px-4">

<div class="w-full max-w-[520px] mx-auto">
    <div class="flex items-center justify-between mb-8 px-2">
        <a href="{% url 'budget:transaction' %}" class="material-symbols-outlined text-slate-400 hover:text-slate-600 transition-colors bg-white p-2 rounded-full shadow-sm">
            close
        </a>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Add Category</h1>
        <div class="w-10"></div>
    </div>

    <main class="bg-white rounded-[2.5rem] p-8 shadow-ios-shadow border border-white/60">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="space-y-2.5">
                <label class="text-[11px] font-bold uppercase tracking-widest text-slate-400 ml-1">Category Name</label>
                <div class="flex items-center bg-[#f8fafb] rounded-2xl px-5 py-1 border border-slate-50 focus-within:ring-2 focus-within:ring-primary/20 transition-all">
                    <span class="material-symbols-outlined text-primary text-[22px] mr-4">category</span>
                    <input name="name"
                           class="w-full bg-transparent border-none focus:ring-0 text-base font-semibold text-slate-900 placeholder:text-slate-300 py-3.5"
                           placeholder="e.g. Monthly Rent"
                           type="text"
                           required
                           value="{{ form.name.value|default_if_none:'' }}"/>
                </div>
                {% if form.name.errors %}
                    <p class="text-red-500 text-[11px] mt-1 ml-1">{{ form.name.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="pt-4">
                <button class="w-full bg-primary text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-primary/30 hover:bg-blue-600 active:scale-[0.98] transition-all flex items-center justify-center" type="submit">
                    Save Category
                </button>
            </div>
        </form>
    </main>
</div>

</body>
</html>
